# A --no-verify push, or a push from a machine that never installed the pre-push
# hook, would otherwise publish unscanned commits. The scan itself lives in
# buzzcasting-storage, which is public, so the rules and the pinned scanner
# version have one home instead of a copy per repository.
name: Secret scan

on: [push, pull_request]

jobs:
  secret-scan:
    name: secret scan
    uses: TouchFlows/buzzcasting-storage/.github/workflows/secret-scan.yml@main
