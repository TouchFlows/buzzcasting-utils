# A --no-verify push, or a push from a machine that never installed the pre-push
# hook, would otherwise publish unscanned commits. The scan lives in
# buzzcasting-storage, which is public, so the rules and the pinned scanner
# version have one home instead of a copy per repository.
#
# Pinned to one commit, in both places: the workflow definition and the guard it
# fetches. Nothing that lands on buzzcasting-storage main later can run code in
# this repository's CI. The "Guard pin" workflow fails when this falls behind, so
# the pin cannot drift quietly. To bump by hand, put a commit from that main in
# both fields - they must match, or the workflow runs old logic against new
# scripts:
#   gh api repos/TouchFlows/buzzcasting-storage/commits/main --jq .sha
name: Secret scan

on: [push, pull_request]

jobs:
  secret-scan:
    name: secret scan
    uses: TouchFlows/buzzcasting-storage/.github/workflows/secret-scan.yml@adf3628f6104c5444bfb9c38949b82bf863a7f6b
    with:
      guard-ref: adf3628f6104c5444bfb9c38949b82bf863a7f6b
