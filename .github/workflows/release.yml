name: Release

# Publishes to npm via Trusted Publishing (OIDC) - no NPM_TOKEN secret involved.
# Triggered by pushing a version tag, which `npm run release`'s `changelogen
# --release && git push --follow-tags` already does locally. See
# documentation/release-process.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION - refusing to publish."
            exit 1
          fi
      - run: npm publish
