name: Release

# Publishes to npm via Trusted Publishing (OIDC) - no NPM_TOKEN secret involved.
# Triggered by pushing a version tag, which `npm run release`'s `changelogen
# --release && git push --follow-tags` already does locally. See
# documentation/release-process.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION - refusing to publish."
            exit 1
          fi
      # actions/setup-node's bundled npm (whatever ships in that Node version's
      # toolcache - 10.9.8 on node 22.23.2, confirmed) predates npm's OIDC
      # Trusted Publishing support (needs npm >=11.5.1). Without this, `npm
      # publish` silently falls back to an unauthenticated attempt and fails
      # with a 404, not a clear auth error - confirmed live 2026-09-15 in
      # buzzcasting-storage's identical workflow.
      - run: npm install -g npm@latest
      - run: npm publish
